name: '🚀 Release'

# Builds installers for macOS (Apple Silicon + Intel), Linux, and Windows,
# then creates (or updates) a draft GitHub release with the artifacts
# attached. Triggered by pushing a `vX.Y.Z` tag (see docs/development.md's
# release process), or manually via workflow_dispatch.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # On manual dispatch, create and push the vX.Y.Z tag (from tauri.conf.json's
  # version) BEFORE building. This makes the tag ref exist up-front, so
  # publishing the resulting draft release later does NOT create the tag — which
  # would otherwise re-trigger this workflow via push:tags and produce a second,
  # duplicate release. Pushing with the default GITHUB_TOKEN also doesn't
  # re-trigger push:tags (GitHub's recursion guard), so this run isn't doubled
  # either. On the tag-push path this job is skipped (the tag already exists).
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 🏷️ Create and push tag from version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$VERSION"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "Tag $TAG already exists — skipping create/push."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

  publish-tauri:
    needs: [tag]
    # Run after `tag` on dispatch, and also on the tag-push path where `tag` is
    # skipped. Only bail if `tag` actually failed or was cancelled.
    if: ${{ always() && !failure() && !cancelled() }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (M1 and above)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 🟩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 🐧 Install Linux Tauri deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v3.0.0
        with:
          version: latest

      - name: 📦 Install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Too Many Terminals v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
