[package]
name = "too-many-terminals"
version = "0.19.0"
description = "Lightweight cross-platform terminal for Claude Code"
authors = ["Exorsky"]
edition = "2021"

[lib]
name = "too_many_terminals_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "6"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
# rustls (not the default native-tls) so the usage fetch needs no system
# OpenSSL on Linux — this is the only network call the app makes.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
